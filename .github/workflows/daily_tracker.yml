name: Daily tracker

on:
  # GitHub starts scheduled runs late (7 to 12 hours in Nov 2026), so most land after
  # midnight IST; update downloads through the time of the run, so a late run still gets
  # the session that just closed. Run in the Indian evening, Monday to Friday, with a
  # later backup; extra runs are harmless because update is idempotent.
  schedule:
    - cron: "30 10 * * 1-5"   # 10:30 UTC = 16:00 IST, after the 15:30 close
    - cron: "30 13 * * 1-5"   # 13:30 UTC = 19:00 IST, backup
  workflow_dispatch:

concurrency:                   # a manual run never overlaps the scheduled one
  group: daily-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # to commit data/ and state/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Update tracker
        run: python tracker.py update

      # Runs even if the update failed, so the job_log.csv row recording the error
      # is committed; the job is still marked failed.
      - name: Commit data and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ state/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Daily tracker update $(date -u +%Y-%m-%d)"
          git push

  # Rebuild the dashboard from whatever is now on main, even after a failed update,
  # so the page always shows the latest stored data and the latest run status.
  dashboard:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Build dashboard
        run: python tracker.py dashboard

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true   # keep site/.nojekyll, as v3 did

      # deploy-pages can look up the artifact before GitHub lists it and fail with
      # 'No artifacts named "github-pages"' (actions/deploy-pages#451). Wait, and retry
      # once after a longer wait; the job fails only if the retry fails too.
      - name: Wait for the artifact to be listed
        run: sleep 10

      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
